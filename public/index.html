<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donut AI Note</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#F9C05C" />
  <link rel="stylesheet" href="/fonts.css" />
  <style>
    :root {
      --grad-from: #F9C05C;
      --grad-to: #F52D8E;
      --fg: #1a1a1a;
      --fg-strong: #494949;   /* 主要可點文字與圖示 */
      --fg-emphasis: #373737; /* 比 --fg-strong 再深一階，給畫面上的主角文字 */
      --fg-muted: #707070;   /* 次要文字與細邊框；改成固定灰而非半透明，深淺底上都可控 */
      --surface: #FFFFFF;    /* hover 底色與待機波形；在灰色頁面上以「更亮」表示浮起 */
      --preview-bg: #FFFFFF;
      --bg: #F5F5F5;
      --ok: #1a8a4a;
      --danger: #c0392b;
      --danger-bg: rgba(192, 57, 43, .1);
      --scroll-thumb: #C4C4C4;   /* 捲軸拖曳桿；非文字元素，不屬於四階灰的體系 */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f2f2f2;
        --fg-strong: #c8c8c8;   /* 深底上的對應灰度 */
        --fg-emphasis: #e8e8e8;
        --fg-muted: #909090;   /* 深底上的對應灰度，與淺色模式的可讀性相當 */
        --surface: rgba(242, 242, 242, .1);
        /* 深色模式維持半透明淺色：直接用 #F5F5F5 會變成近白底配近白字，讀不到 */
        --preview-bg: rgba(242, 242, 242, .1);
        --bg: #131313;
        --ok: #4ade80;
        --danger: #ff6b5e;
        --danger-bg: rgba(255, 107, 94, .12);
        --scroll-thumb: #4A4A4A;
      }
    }

    * { box-sizing: border-box; }

    /* 捲軸：只留拖曳桿，不畫軌道。預設那條淺色軌道是實心矩形，會蓋掉底下容器的
       圓角，看起來像右上角被切掉一塊。拖曳桿用透明邊框加 background-clip 內縮，
       才不會整根貼著容器邊緣。這個 App 只跑在 Chrome PWA 裡，故只寫 -webkit- 版本。 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      background-clip: content-box;   /* 搭配透明邊框，讓實際色塊窄於配置寬度 */
      border: 2px solid transparent;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* 內容靠上對齊：視窗拉高時版面不得跟著往下飄。
       padding-top 取 70px＝(720 − 580) / 2，讓預設的 480×720 視窗維持原本垂直置中的視覺位置。 */
    body {
      margin: 0; min-height: 100vh; padding: 70px 24px 40px;   /* 下緣 40：捲到底時待分析區不貼著視窗邊 */
      display: flex; align-items: flex-start; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: 'Azeret Mono', 'Noto Sans TC', -apple-system, "PingFang TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 不設 min-height：body 改為靠上對齊後，.stage 的頂端位置已經固定，
       高度不再影響任何元素的位置。留著 580px 只會在視窗縮短時逼出不必要的捲軸。 */
    .stage {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    }
    .panel { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .hidden { display: none !important; }

    /* 標題：固定單行。高度是寫死的常數，三個狀態共用同一組規格，
       所以無論標題多長都不可能推動下方的麥克風——這是把版面位移這個變因徹底消掉。
       輸入以 maxlength=16 硬性限制字數：中文全形字在 18px 字級下每字約 18px，
       288 ÷ 18 = 16，剛好填滿底線寬度而不溢出。顯示端超出寬度則以 … 截斷。
       寬度 288px 對齊 visualizer 的整排長條，底線與波形同寬。 */
    .title-input, .rec-title, .done-title {
      width: 288px; height: calc(1.4em + 13px); margin-bottom: 52px;
      padding: 6px 0; border-bottom: 1px solid transparent;
      font-size: 18px; line-height: 1.4; text-align: center;
    }
    .title-input {
      border: 0; border-bottom: 1px solid transparent; outline: none;
      background: none; color: var(--fg); font-family: inherit;
    }
    /* 空欄位時不顯示游標——置中對齊下，正中央一條閃爍直線很突兀。
       一旦有文字就恢復顯示，否則打字時看不到插入點、無法修改中間的字。 */
    .title-input:placeholder-shown { caret-color: transparent; }
    .title-input::placeholder { color: var(--fg-muted); }
    .title-input:focus { border-bottom-color: var(--fg-muted); }
    /* 錄音頁／完成頁：單行，超出寬度以 … 截斷 */
    .rec-title, .done-title {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 槽位高度是寫死的固定值；.is-empty 是日後為此元素加上背景或底線時的保險 */
    .rec-title.is-empty { visibility: hidden; }

    /* 中央大按鈕 */
    .orb {
      width: 64px; height: 64px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center;
      border: 0; border-radius: 12px; background: none; cursor: pointer;
      transition: background-color .2s;
    }
    /* 錄音中的方塊同樣要有 hover 灰底——它是「停止並分析」的觸發點，沒有回饋會看不出可點 */
    .orb:hover { background: var(--surface); }
    .mic { width: 40px; height: 40px; color: var(--fg-strong); }
    .cube {
      width: 24px; height: 24px; border-radius: 4px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      animation: spin 3s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .paused .cube { animation-play-state: paused; }

    /* 計時器 */
    .timer {
      margin-bottom: 20px;
      font-family: 'Azeret Mono', ui-monospace, monospace;
      font-size: 14px; font-variant-numeric: tabular-nums;
      color: var(--fg-muted);
    }
    #view-recording .timer { color: var(--fg-strong); }

    /* visualizer（相對參考元件等比放大 1.5 倍，錄音時更明顯） */
    .wave {
      width: 288px; height: 24px; margin-bottom: 40px;
      display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    .wave .bar {
      width: 3px; height: 100%; border-radius: 1.5px;
      background: var(--fg-muted);
      transform: scaleY(.25); transform-origin: center;
      transition: transform .12s ease-out;
    }
    #wave .bar {
      background: linear-gradient(180deg, var(--grad-from), var(--grad-to));
    }

    /* 文字控制項 */
    .linkbtn {
      padding: 4px 10px; border: 0; border-radius: 6px;
      background: none; color: var(--fg-strong); cursor: pointer;
      font: inherit; font-size: 16px;
      display: inline-block; text-decoration: none;   /* 同一套樣式也用在 <a> 上 */
    }
    .linkbtn:hover { background: var(--surface); }
    .linkbtn--danger { color: var(--danger); }
    .linkbtn + .linkbtn { margin-top: 20px; }
    /* 前一個控制項被隱藏時（例如寫入 Notion 而不顯示檔案路徑），不要留下它的間距 */
    .linkbtn.hidden + .linkbtn { margin-top: 0; }
    /* .md 輸出時連結不可點，只作為路徑顯示 */
    .linkbtn.is-file { cursor: default; word-break: break-all; }
    .linkbtn.is-file:hover { background: none; }

    /* 處理中：三個方塊階梯式跳動（尺寸為參考來源的 1.5 倍，與 visualizer 的放大倍率一致）。
       與其他三頁一樣靠上固定，距內容區頂端 200px。 */
    .ld-stairs {
      display: flex; gap: 9px; align-items: flex-end;
      margin-top: 200px; margin-bottom: 20px;
    }
    .ld-stairs i {
      width: 18px; height: 18px; border-radius: 2px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      animation: stairs 1.2s ease-in-out infinite;
    }
    .ld-stairs i:nth-child(2) { animation-delay: .15s; }
    .ld-stairs i:nth-child(3) { animation-delay: .3s; }
    @keyframes stairs {
      0%, 100% { transform: translateY(0); opacity: .3; }
      50%      { transform: translateY(-21px); opacity: 1; }
    }
    /* 比其他可點文字更深：分析中它是畫面上唯一的主角 */
    .proc-stage { font-size: 16px; color: var(--fg-emphasis); text-align: center; }
    /* 等待期間的唯一資訊來源：沒有它，「重試中」和「已經死了」長得一模一樣 */
    .proc-detail {
      margin-top: 20px; font-size: 14px; line-height: 1.7;
      color: var(--fg-muted); text-align: center; min-height: calc(1.7em * 3);
    }
    .proc-detail.is-retrying { color: var(--danger); }
    /* 出口：不急的時候可以留在這頁看它跑完，趕時間就離開去錄下一場 */
    #btn-leave { margin-top: 20px; }

    /* 分析清單：刻意低調，它是提醒不是主角。只出現在待機頁——
       錄音頁與摘要頁都是專心做一件事的地方，列一串在下面只是干擾。
       同時裝著分析中／待分析／已完成三種狀態，點分析中那列可回到處理中那頁。 */
    /* 跟著各頁內容走：每頁高度不同，但與上方元素永遠隔 80 */
    .pending { margin-top: 80px; width: calc(100vw - 80px); text-align: left; }
    .pending-title { font-size: 14px; color: var(--fg-muted); margin-bottom: 20px; }
    .pending-item {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
      font-size: 14px; color: var(--fg-muted);
      padding: 20px; border-radius: 10px; background: var(--surface);
    }
    .pending-item + .pending-item { margin-top: 12px; }
    /* 視窗窄時左側文字換行完整呈現；動作永遠不被壓縮，不能讓使用者按不到 */
    .pending-label { flex: 1; min-width: 0; }
    .job-meta { margin-top: 4px; }
    /* 重試中用警示色：跟「正常等待」要一眼分得出來（沿用原處理頁的處理方式） */
    .job-retry { margin-top: 4px; color: var(--danger); }
    .pending-actions { display: flex; gap: 8px; flex-shrink: 0; margin: -4px -10px 0 0; }
    .pending-item button {
      padding: 4px 10px; border: none; border-radius: 6px; background: none;
      color: var(--fg-strong); cursor: pointer; font: inherit; font-size: 14px;
    }
    .pending-item button:hover { background: var(--bg); }
    .pending-item button:disabled { color: var(--fg-muted); cursor: default; background: none; }

    /* 完成 */
    .done-title { margin-bottom: 20px; }   /* 高度與字級由上方共用規則提供 */
    /* 摘要：永遠展開、固定高、距視窗左右各 40px（刻意寬於 .stage，靠置中突破）。
       calc(100vw - 80px) 恆窄於 body 的內容框，不會產生橫向捲軸。
       複製鈕放在外層容器而非 #preview 內，否則會跟著內容一起捲走。 */
    .preview-box {
      position: relative;
      width: calc(100vw - 80px);
      margin-bottom: 20px;
    }
    #preview {
      width: 100%;
      height: 600px; overflow-y: auto;
      padding: 28px 20px 20px; border-radius: 10px;   /* 上緣多留 16px 給複製鈕 */
      background: var(--preview-bg);
      font-size: 14px; line-height: 1.6;   /* 內文字級；兩區標題與議題標題另有指定 */
      text-align: left;
    }
    .copy-btn {
      /* right 要讓開捲軸的 8px，否則圖示會壓在拖曳桿上；14 = 8 + 原本的 6 */
      position: absolute; top: 6px; right: 14px; z-index: 1;
      width: 28px; height: 28px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border: 0; border-radius: 6px; background: none;
      color: var(--fg-muted); cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .copy-btn:hover { background: var(--surface); color: var(--fg-strong); }
    .copy-btn .ico { width: 15px; height: 15px; }
    .copy-btn .ico-check { display: none; }
    .copy-btn.copied { color: var(--ok); }
    .copy-btn.copied .ico-copy { display: none; }
    .copy-btn.copied .ico-check { display: block; }
    #preview ul { margin: 8px 0 0; padding-left: 20px; }
    /* 明確指定字級：small 元素的預設縮小比例會隨瀏覽器而異 */
    #preview .pv-note { display: block; margin-top: 40px; font-size: 12px; color: var(--fg-muted); }
    /* 兩大區的標題：份量要明顯大於議題標題，否則四層文字看起來一樣重 */
    .pv-section { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
    .pv-section + .pv-topic { margin-top: 0; }
    #preview .pv-section:not(:first-child) { margin-top: 40px; }
    .pv-topic { margin: 16px 0 0; font-size: 16px; font-weight: 600; }
    /* 待辦用方框呈現。App 這邊是回顧用的預覽，要打勾請到 Notion */
    #preview ul.pv-todo { list-style: none; padding-left: 2px; }
    #preview ul.pv-todo li { position: relative; padding-left: 22px; margin-bottom: 4px; }
    #preview ul.pv-todo li::before {
      content: ''; position: absolute; left: 0; top: 3px;
      width: 12px; height: 12px; border: 1.5px solid var(--fg-muted); border-radius: 3px;
    }

    /* 確認對話框（原生 <dialog>：外觀自訂，焦點鎖定與 Esc 關閉由瀏覽器提供） */
    .dialog {
      /* 固定 320 而非 max-width：<dialog> 預設 fit-content，只設上限的話短句的框會縮得比長句小。
         視窗窄於 360 時讓步，否則框會被裁掉。高度不設，由內容撐開。 */
      width: 320px; max-width: calc(100vw - 40px);
      padding: 20px; border: 0; border-radius: 12px;
      background: var(--bg); color: var(--fg); text-align: center;
    }
    .dialog::backdrop { background: rgba(0, 0, 0, .45); }
    .dialog-msg { margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
    .dialog-msg--title { font-size: 16px; font-weight: 600; }
    .dialog-actions { display: flex; justify-content: center; gap: 8px; }
    /* 對話框內兩顆按鈕並排，需抵銷 .linkbtn + .linkbtn 的垂直間距 */
    .dialog-actions .linkbtn + .linkbtn { margin-top: 0; }

    /* 錯誤 */
    #err {
      width: calc(100vw - 80px);   /* 與摘要同寬，刻意寬於 .stage */
      margin-top: 16px; padding: 20px; border-radius: 10px;
      background: var(--danger-bg); color: var(--danger);
      font-size: 14px; text-align: left; white-space: pre-wrap;
    }
    #btn-retry { margin-top: 40px; }
  </style>
</head>
<body>
  <main class="stage">
    <section id="view-idle" class="panel">
      <input id="title" type="text" class="title-input" maxlength="16" placeholder="會議標題（空白就讓 AI 命名）" />
      <button id="btn-start" class="orb" title="開始錄音" aria-label="開始錄音">
        <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
      </button>
      <div class="timer" aria-hidden="true">00:00</div>
      <div class="wave" aria-hidden="true"></div>
    </section>

    <section id="view-recording" class="panel hidden">
      <div id="rec-title" class="rec-title is-empty"></div>
      <button id="btn-stop" class="orb" title="停止並分析" aria-label="停止並分析">
        <span class="cube" aria-hidden="true"></span>
      </button>
      <div class="timer" id="timer">00:00</div>
      <div class="wave" id="wave" aria-hidden="true"></div>
      <button id="btn-pause" class="linkbtn">Pause</button>
      <button id="btn-restart" class="linkbtn linkbtn--danger">Restart</button>
    </section>

    <section id="view-processing" class="panel hidden">
      <div class="ld-stairs" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="proc-stage" role="status">Analyzing with Gemini…</div>
      <div class="proc-detail" id="proc-detail" role="status"></div>
      <button id="btn-leave" class="linkbtn">先去錄下一場</button>
    </section>

    <section id="view-done" class="panel hidden">
      <div id="done-title" class="done-title"></div>
      <div class="preview-box">
        <button id="btn-copy" class="copy-btn" title="複製摘要" aria-label="複製摘要">
          <svg class="ico ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <svg class="ico ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </button>
        <div id="preview"></div>
      </div>
      <a class="linkbtn" id="result-link" href="#" target="_blank" rel="noopener"></a>
      <button id="btn-new" class="linkbtn">New AI Note</button>
    </section>

    <div id="err" class="hidden" role="alert"></div>
    <button id="btn-retry" class="linkbtn hidden">再試一次</button>

    <!-- 分析中／待分析／已完成 三種狀態都列在這裡；摘要頁不顯示，那頁是拿來讀的 -->
    <section id="jobs" class="pending hidden" aria-label="分析清單"></section>
  </main>

  <dialog id="confirm-restart" class="dialog">
    <p class="dialog-msg">確定要丟掉目前錄音、重新開始嗎？</p>
    <div class="dialog-actions">
      <button id="btn-cancel-restart" class="linkbtn">Cancel</button>
      <button id="btn-confirm-restart" class="linkbtn linkbtn--danger">Restart</button>
    </div>
  </dialog>

  <!-- 錄音已經開始才跳出：提醒不該擋住錄音，沒注意到這個框也不會漏錄 -->
  <dialog id="auto-stop-notice" class="dialog">
    <p class="dialog-msg dialog-msg--title">已達錄音上限</p>
    <p class="dialog-msg">
      錄音已滿三小時，自動停止並開始分析。<br>
      再錄下去會因為檔案超過上傳上限而整段無法保存。
    </p>
    <div class="dialog-actions">
      <button id="btn-auto-stop-ok" class="linkbtn">知道了</button>
    </div>
  </dialog>

  <dialog id="quota-notice" class="dialog">
    <p class="dialog-msg dialog-msg--title">已開始錄音</p>
    <p class="dialog-msg">
      上次分析因 Gemini 額度已達上限而失敗，額度預計在<span id="quota-reset"></span> 重置。<br>
      這次錄音會保留在待分析清單。
    </p>
    <div class="dialog-actions">
      <button id="btn-quota-ok" class="linkbtn">知道了</button>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
